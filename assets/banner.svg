<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Faloon: student, aspiring Python backend developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="220" rx="16"/></clipPath>
  </defs>

  <!-- AMOLED base -->
  <rect width="900" height="220" rx="16" fill="#000000"/>

  <!-- light sources behind the glass -->
  <g clip-path="url(#frame)" filter="url(#blur)">
    <circle cx="170" cy="60" r="70" fill="#22d3ee" opacity="0.55">
      <animate attributeName="cx" values="170;240;170" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="150" r="90" fill="#8b5cf6" opacity="0.55">
      <animate attributeName="cx" values="730;660;730" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="205" r="50" fill="#3b82f6" opacity="0.35">
      <animate attributeName="cy" values="205;180;205" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- glass panel -->
  <rect x="24" y="24" width="852" height="172" rx="20" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.2"/>
  <rect x="60" y="24.6" width="780" height="1.2" fill="url(#shine)"/>

  <!-- window dots + title -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" fill-opacity="0.28"/>
  <circle cx="68" cy="50" r="5" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="86" cy="50" r="5" fill="#ffffff" fill-opacity="0.10"/>
  <text x="450" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#ffffff" fill-opacity="0.45">faloon@github: ~</text>

  <!-- glass T (T-shaped skill set) -->
  <path d="M628 88 H812 Q822 88 822 98 V104 Q822 114 812 114 H742 V168 Q742 178 732 178 H708 Q698 178 698 168 V114 H628 Q618 114 618 104 V98 Q618 88 628 88 Z"
        fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.4" stroke-linejoin="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
      <text x="40" y="92" font-size="16"><tspan fill="#22d3ee">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
      <rect x="142" y="78" width="9" height="16" fill="#e6edf3">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
      <text x="40" y="134" font-size="38" font-weight="700" fill="url(#accent)">Faloon</text>
      <text x="200" y="134" font-size="16" fill="#e6edf3" fill-opacity="0.85">student / aspiring backend developer</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
      <g font-size="13" fill="#e6edf3" text-anchor="middle">
        <rect x="40"  y="150" width="76" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="78"  y="167">python</text>
        <rect x="126" y="150" width="86" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="169" y="167">backend</text>
        <rect x="222" y="150" width="66" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="255" y="167">linux</text>
        <rect x="298" y="150" width="92" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="344" y="167">networks</text>
        <rect x="400" y="150" width="92" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="446" y="167">hardware</text>
      </g>
    </g>
  </g>
</svg>
